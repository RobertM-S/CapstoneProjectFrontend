<div>
    <h2>{{restaurant.restaurantname}}</h2>
    <div class="client" style="background-image: url('{{restaurant.restaurantimage}}');">
    </div>
    <div *ngIf="foods.length > 0">
        <div class="row">
            <div *ngFor="let food of foods" class="col-4">
            <app-food [food]="food" [restaurantid]="restaurant.restaurantid"></app-food>
            </div>
        </div>
    </div>
    <div class="container" *ngIf="foods.length < 1">
        <h1>There are no restaurants available at this location</h1>
    </div>
</div>
